# Extra named metrics built from raw scraped data (helps dashboards stay simple).
# Some lines only produce numbers after the apps have sent enough traffic — that’s OK.

groups:
  - name: aris_availability
    interval: 30s
    rules:
      # 1 if Prometheus could reach the collector metrics endpoint, 0 if not.
      - record: aris:otel_collector:up
        expr: up{job="otel-collector-app-metrics"}

  - name: aris_http_from_otel
    interval: 10s
    rules:
      # Rough “slow request” line: 99th percentile of HTTP duration over ~10 minutes (if that histogram exists).
      # If your library names metrics differently, you may need to tweak the name inside the rate(...).
      - record: aris:http_server_duration:p99_10m
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(http_server_duration_milliseconds_bucket{job="otel-collector-app-metrics"}[10m])
            )
          )
      - record: aris:http_server_duration:p50_10m
        expr: |
          histogram_quantile(
            0.50,
            sum by (le) (
              rate(http_server_duration_milliseconds_bucket{job="otel-collector-app-metrics"}[10m])
            )
          )

  # Policy service: native histogram aris_policy_decision_latency_seconds (seconds).
  - name: aris_policy
    interval: 30s
    rules:
      # Rough P99 of decision time over 5 minutes (for SLO-style dashboards).
      - record: aris:policy:decision_latency_p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(aris_policy_decision_latency_seconds_bucket{job="aris-policy-service"}[5m])
            )
          )
      # Total decisions per second (all routes combined).
      - record: aris:policy:decisions_per_second
        expr: |
          sum(rate(aris_policy_decisions_total{job="aris-policy-service"}[5m]))
      # How often safeguards rewrite the suggestion (all reasons, all routes).
      - record: aris:policy:overrides_per_second
        expr: |
          sum(rate(aris_safeguard_overrides_total{job="aris-policy-service"}[5m]))
