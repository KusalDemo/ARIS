# OPTIONAL add-on: a single Kafka broker for the telemetry bridge.
#
# The bridge reads Prometheus by default. Use Kafka when
# you want services to push telemetry events the moment they happen instead of waiting for a scrape.
#
# Start it with:  make compose-up-kafka      Stop it with:  make compose-down-kafka
# That merges this file on top of infra/docker/docker-compose.yml, so the base stack is unchanged
# and the telemetry-bridge simply gets KAFKA_BOOTSTRAP_SERVERS pointed at the new broker.
#
# Events use the topic aris.telemetry.v1 (see services/telemetry-bridge/main.py).

services:
  # KRaft mode means Kafka runs without a separate ZooKeeper container - one less moving part.
  kafka:
    image: docker.io/bitnami/kafka:3.7.2-debian-12-r3
    ports:
      - "9092:9092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [aris]
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # This block does not create a second bridge: it patches the one from the base compose file.
  telemetry-bridge:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      prometheus:
        condition: service_healthy
      kafka:
        condition: service_healthy
