# Merged after upstream socialNetwork/docker-compose.yml: every DSB service joins the ARIS network.
# The network name aris_aris matches Docker Compose project "aris" + network key "aris" from infra/docker/docker-compose.yml.
networks:
  aris:
    external: true
    name: aris_aris

services:
  compose-post-service:
    networks:
      - aris
  home-timeline-redis:
    networks:
      - aris
  home-timeline-service:
    networks:
      - aris
  jaeger-agent:
    networks:
      - aris
  media-frontend:
    networks:
      - aris
  media-memcached:
    networks:
      - aris
  media-mongodb:
    networks:
      - aris
  media-service:
    networks:
      - aris
  nginx-thrift:
    networks:
      - aris
  post-storage-memcached:
    networks:
      - aris
  post-storage-mongodb:
    networks:
      - aris
  post-storage-service:
    networks:
      - aris
  social-graph-mongodb:
    networks:
      - aris
  social-graph-redis:
    networks:
      - aris
  social-graph-service:
    networks:
      - aris
  text-service:
    networks:
      - aris
  unique-id-service:
    networks:
      - aris
  url-shorten-memcached:
    networks:
      - aris
  url-shorten-mongodb:
    networks:
      - aris
  url-shorten-service:
    networks:
      - aris
  user-memcached:
    networks:
      - aris
  user-mention-service:
    networks:
      - aris
  user-mongodb:
    networks:
      - aris
  user-service:
    networks:
      - aris
  user-timeline-mongodb:
    networks:
      - aris
  user-timeline-redis:
    networks:
      - aris
  user-timeline-service:
    networks:
      - aris

  # When you merge this file for DeathStarBench, Envoy reads envoy-dsb.yaml and forwards to nginx-thrift.
  envoy:
    volumes:
      - ../envoy/envoy-dsb.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      policy-service:
        condition: service_healthy
      nginx-thrift:
        condition: service_started
